name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Next.js dashboard validation
    runs-on: ubuntu-latest
    # A hung dependency or browser download must fail fast instead of holding the
    # runner for the 6-hour default.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Clear inherited visual evidence
        run: rm -rf artifacts/os-rebuild test-results playwright-report

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser journeys
        timeout-minutes: 20
        run: npm run test:e2e

      - name: Preserve complete browser suite results
        if: always()
        run: |
          if [ -f test-results/e2e-results.json ]; then
            mkdir -p artifacts/os-rebuild
            cp test-results/e2e-results.json artifacts/os-rebuild/full-e2e-results.json
          fi

      - name: Verify mobile voice preview stability without retries
        timeout-minutes: 10
        run: npx playwright test tests/e2e/conversation.spec.ts --project=webkit-mobile --grep "previews with the chosen browser voice" --repeat-each=10 --retries=0

      - name: Upload visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-visual-proof
          path: |
            artifacts/os-rebuild/*.png
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload browser validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-browser-results
          path: |
            artifacts/os-rebuild/full-e2e-results.json
            test-results/e2e-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-browser-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
