name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Next.js dashboard validation
    runs-on: ubuntu-latest
    # A hung dependency or browser download must fail fast instead of holding the
    # runner for the 6-hour default.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Clear inherited visual evidence
        run: rm -rf artifacts/os-rebuild test-results

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser journeys
        timeout-minutes: 20
        run: npm run test:e2e

      - name: Upload visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-visual-proof
          path: |
            artifacts/os-rebuild/*.png
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7
